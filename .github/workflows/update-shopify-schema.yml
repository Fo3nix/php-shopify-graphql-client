name: Update Shopify Admin schema

on:
  schedule:
    # 06:00 UTC on the 2nd day of every month
    - cron: '0 6 2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-shopify-schema
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Discover supported API versions
        id: versions
        run: |
          RESPONSE=$(curl -fsS -X POST "https://shopify.dev/admin-graphql-direct-proxy/unstable" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ publicApiVersions { handle supported } }"}')
          VERSIONS=$(echo "$RESPONSE" | jq -c '[.data.publicApiVersions[] | select(.supported) | .handle]')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  generate:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install generator
        run: composer install --no-interaction --no-progress

      - name: Generate schema classes
        id: generate
        run: |
          VERSION="${{ matrix.version }}"
          NODASH="${VERSION//-}"
          DIR="src/ShopifyAdmin${NODASH}"
          BRANCH="shopify-schema/${VERSION}"
          mkdir -p "$DIR"
          printf '\n\n' | php vendor/bin/generate_schema_objects \
            -u "https://shopify.dev/admin-graphql-direct-proxy/${VERSION}" \
            -d "$DIR" \
            -n "Fo3nix\\ShopifyGraphQL\\ShopifyAdmin${NODASH}" \
            -p "Shopify"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          git add -A -- "$DIR"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BRANCH"
            if git diff --cached --quiet FETCH_HEAD -- "$DIR"; then
              CHANGED=false
              FILES=0
            else
              CHANGED=true
              FILES=$(git diff --cached --name-only FETCH_HEAD -- "$DIR" | wc -l)
            fi
          else
            CHANGED=true
            FILES=$(git diff --cached --name-only HEAD -- "$DIR" | wc -l)
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "changed_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED changed_files=$FILES"

      - name: Create or update pull request
        id: cpr
        if: steps.generate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: ${{ steps.generate.outputs.dir }}
          branch: shopify-schema/${{ matrix.version }}
          assignees: Fo3nix
          reviewers: Fo3nix
          delete-branch: true
          commit-message: Update Shopify Admin API ${{ matrix.version }} schema classes
          title: Update Shopify Admin API ${{ matrix.version }} schema classes
          body: |
            Automated regeneration of the Shopify Admin API `${{ matrix.version }}` schema classes.

            - Generated with `fo3nix/php-graphql-oqm` from the public introspection proxy
            - Release notes: https://shopify.dev/docs/api/release-notes

      - name: Comment on still-open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ matrix.version }}"
          BRANCH="shopify-schema/${VERSION}"
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "No open pull request for $BRANCH"
            exit 0
          fi
          if [ "${{ steps.cpr.outputs.pull-request-operation }}" = "created" ]; then
            echo "Pull request #$PR was just created; skipping reminder comment"
            exit 0
          fi
          if [ "${{ steps.generate.outputs.changed }}" = "true" ]; then
            BODY="Monthly schema check for ${VERSION}: schema classes were updated (${{ steps.generate.outputs.changed_files }} file(s) changed)."
          else
            BODY="Monthly schema check for ${VERSION}: no schema changes this month. This pull request is still open and awaiting review."
          fi
          gh pr comment "$PR" --body "$BODY"
